<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>家庭记账 · 收支云同步</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,sans-serif; }
        body { background:#f7f9fc; padding:20px 12px 40px; min-height:100vh; display:flex; justify-content:center; }
        .app-container { max-width:720px; width:100%; background:white; border-radius:36px; box-shadow:0 20px 40px rgba(0,10,30,0.08); padding:24px 20px 32px; }
        h1 { font-size:28px; font-weight:600; color:#0b1b33; display:flex; align-items:center; gap:12px; margin-bottom:6px; }
        h1 i { color:#2a7de1; }
        .subhead { color:#5b6f8c; font-size:15px; margin-bottom:16px; border-left:3px solid #2a7de1; padding-left:14px; background:#f0f4fe; border-radius:0 12px 12px 0; line-height:1.5; }
        .sync-status { display:flex; align-items:center; gap:8px; font-size:13px; color:#4f658a; background:#e8edf5; padding:6px 16px; border-radius:40px; margin-bottom:16px; }
        .sync-status .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
        .sync-status .dot.online { background:#1e7e34; }
        .sync-status .dot.syncing { background:#f5a623; animation:pulse 0.8s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
        .summary-grid { display:grid; grid-template-columns:1fr 1fr 1fr 1fr 1fr; gap:6px; background:#f0f5ff; padding:12px 10px; border-radius:28px; margin-bottom:20px; }
        .summary-item { text-align:center; }
        .summary-item .label { font-size:10px; font-weight:500; color:#4f658a; }
        .summary-item .value { font-size:16px; font-weight:700; color:#0b1b33; margin-top:2px; }
        .summary-item .value.positive { color:#1e7e34; }
        .summary-item .value.negative { color:#c53e3e; }
        .summary-item .value.neutral { color:#2a4b7a; }
        .summary-item .value.warning { color:#d48c2c; }

        /* 月度汇总卡片 */
        .monthly-card { background:linear-gradient(135deg,#e8f0fe,#d4e2fa); border-radius:20px; padding:16px 18px; margin-bottom:16px; display:flex; justify-content:space-around; align-items:center; flex-wrap:wrap; gap:10px; }
        .monthly-card .item { text-align:center; }
        .monthly-card .item .label { font-size:11px; color:#3a5a7a; }
        .monthly-card .item .value { font-size:18px; font-weight:700; }
        .monthly-card .item .value.income { color:#1e7e34; }
        .monthly-card .item .value.expense { color:#c53e3e; }
        .monthly-card .item .value.neutral { color:#2a4b7a; }

        .section-title { font-size:18px; font-weight:600; color:#1f2b44; display:flex; align-items:center; gap:10px; margin:24px 0 14px 0; flex-wrap:wrap; }
        .section-title i { color:#2a7de1; width:24px; text-align:center; }
        .section-title .badge { background:#dbe7f9; color:#1f3a6b; font-size:13px; font-weight:500; padding:2px 12px; border-radius:40px; }
        .section-title .toolbar { margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; }
        .card { background:#ffffff; border-radius:24px; padding:18px 16px; border:1px solid #e8edf5; margin-bottom:16px; }
        .record-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #eef2f9; }
        .record-item:last-child { border-bottom:none; }
        .item-left { display:flex; flex-direction:column; gap:3px; flex:1; }
        .item-title { font-weight:600; color:#14273e; font-size:15px; }
        .item-meta { font-size:12px; color:#6a7f9e; display:flex; flex-wrap:wrap; gap:8px; }
        .item-meta i { margin-right:3px; }
        .item-amount { font-weight:650; font-size:16px; }
        .item-amount.income { color:#1e7e34; }
        .item-amount.expense { color:#c53e3e; }
        .item-amount.debt { color:#c53e3e; }
        .item-amount.repay { color:#1e7e34; }
        .empty-message { color:#8a9bb8; font-size:14px; padding:10px 0; text-align:center; }
        .form-row { display:flex; flex-wrap:wrap; gap:10px 6px; margin:10px 0 4px; }
        .form-group { flex:1 0 calc(50% - 6px); min-width:140px; }
        .form-group label { display:block; font-size:12px; font-weight:500; color:#2d4468; margin-bottom:3px; }
        .form-group input, .form-group select { width:100%; padding:10px 14px; border:1px solid #d8e0ec; border-radius:16px; font-size:14px; background:white; outline:none; }
        .form-group input:focus, .form-group select:focus { border-color:#2a7de1; box-shadow:0 0 0 3px rgba(42,125,225,0.12); }
        .btn-group { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
        .btn { border:none; padding:10px 20px; border-radius:40px; font-weight:600; font-size:14px; display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; transition:0.15s; flex:1 0 auto; background:#eef3fc; color:#1d3a66; }
        .btn-primary { background:#1a3f77; color:white; }
        .btn-primary:hover { background:#12315e; }
        .btn-success { background:#1b7e3a; color:white; }
        .btn-success:hover { background:#13662e; }
        .btn-warning { background:#d48c2c; color:white; }
        .btn-warning:hover { background:#b87822; }
        .btn-danger { background:#b13e3e; color:white; }
        .btn-danger:hover { background:#942f2f; }
        .btn-outline { background:transparent; border:1px solid #c6d3e8; }
        .btn-outline:hover { background:#eaf0fa; }
        .btn-sm { padding:5px 12px; font-size:12px; flex:0 1 auto; }
        .action-icon { background:transparent; border:none; color:#687c9e; cursor:pointer; padding:4px 8px; border-radius:30px; }
        .action-icon:hover { background:#e9eff8; color:#1f3f6b; }
        .footer-tip { margin-top:24px; color:#6d83a5; font-size:13px; text-align:center; border-top:1px solid #e4ebf5; padding-top:16px; }
        .tab-group { display:flex; gap:4px; margin-bottom:12px; background:#eef3fc; border-radius:40px; padding:4px; }
        .tab-btn { flex:1; padding:8px 12px; border:none; border-radius:30px; font-weight:600; font-size:13px; cursor:pointer; background:transparent; color:#4f658a; transition:0.2s; }
        .tab-btn.active { background:white; color:#1a3f77; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
        .tab-content { display:none; }
        .tab-content.active { display:block; }
        .tag { display:inline-block; font-size:10px; padding:1px 10px; border-radius:30px; font-weight:500; }
        .tag-income { background:#d4edda; color:#1e7e34; }
        .tag-expense { background:#f8dddd; color:#b13e3e; }
        .tag-debt { background:#fce4d6; color:#b13e3e; }
        .tag-repay { background:#d4edda; color:#1e7e34; }

        /* 年度汇总折叠 */
        .yearly-collapse { background:#f6f9fc; border-radius:16px; padding:12px 16px; margin-top:12px; cursor:pointer; border:1px solid #e8edf5; }
        .yearly-collapse .header { display:flex; justify-content:space-between; align-items:center; font-weight:600; color:#1f2b44; }
        .yearly-collapse .header i { transition:0.3s; }
        .yearly-collapse .header i.open { transform:rotate(180deg); }
        .yearly-collapse .content { display:none; padding-top:12px; }
        .yearly-collapse .content.open { display:block; }
        .yearly-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed #e8edf5; font-size:14px; }
        .yearly-row:last-child { border-bottom:none; }
        .yearly-row .month { color:#2d4468; font-weight:500; }
        .yearly-row .in { color:#1e7e34; }
        .yearly-row .out { color:#c53e3e; }

        .reminder-banner { background:#fff3e0; border-radius:16px; padding:12px 16px; margin-bottom:16px; border-left:4px solid #d48c2c; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .reminder-banner .icon { font-size:24px; color:#d48c2c; }
        .reminder-banner .text { flex:1; font-size:14px; color:#5a4a2a; }

        @media (max-width:480px) { .summary-grid { grid-template-columns:1fr 1fr 1fr; } .form-group { flex:1 0 100%; } .btn-group .btn { flex:1 0 100%; } .monthly-card { flex-direction:column; align-items:stretch; gap:6px; } .monthly-card .item { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid rgba(0,0,0,0.05); } .monthly-card .item:last-child { border-bottom:none; } }
    </style>
</head>
<body>
<div class="app-container">
    <header>
        <h1><i class="fas fa-cloud"></i> 家庭共记</h1>
        <div class="subhead"><i class="fas fa-users"></i> 收支 · 欠债 · 云端同步 · 智能分析</div>
        <div class="sync-status" id="syncStatus">
            <span class="dot online" id="syncDot"></span>
            <span id="syncText">加载中...</span>
        </div>
    </header>

    <!-- 汇总 -->
    <div class="summary-grid">
        <div class="summary-item"><div class="label">总收入</div><div class="value positive" id="totalIncome">0</div></div>
        <div class="summary-item"><div class="label">总支出</div><div class="value negative" id="totalExpense">0</div></div>
        <div class="summary-item"><div class="label">净收益</div><div class="value neutral" id="netAmount">0</div></div>
        <div class="summary-item"><div class="label">总欠债</div><div class="value negative" id="totalDebt">0</div></div>
        <div class="summary-item"><div class="label">实时欠款</div><div class="value negative" id="realTimeDebt">0</div></div>
    </div>

    <!-- 月度汇总 -->
    <div class="monthly-card" id="monthlyCard">
        <div class="item"><div class="label">📆 本月</div><div class="value neutral" id="monthLabel">2026-08</div></div>
        <div class="item"><div class="label">收入</div><div class="value income" id="monthIncome">¥0</div></div>
        <div class="item"><div class="label">支出</div><div class="value expense" id="monthExpense">¥0</div></div>
        <div class="item"><div class="label">结余</div><div class="value neutral" id="monthBalance">¥0</div></div>
    </div>

    <!-- 每日提醒横幅 -->
    <div class="reminder-banner" id="reminderBanner" style="display:none;">
        <div class="icon"><i class="fas fa-bell"></i></div>
        <div class="text" id="reminderText">📊 昨日收支汇总：收入 ¥0，支出 ¥0</div>
        <button class="btn btn-sm btn-outline" id="dismissReminderBtn">关闭</button>
    </div>

    <!-- 欠债 & 还款 -->
    <div class="section-title">
        <i class="fas fa-file-invoice"></i> 欠债 & 还款 <span class="badge" id="debtCount">0</span>
        <div class="toolbar">
            <button class="btn btn-sm btn-outline" id="testReminderBtn"><i class="fas fa-bell"></i> 测试提醒</button>
        </div>
    </div>
    <div class="card"><div id="debtItemsContainer"><div class="empty-message">暂无欠债记录</div></div></div>

    <div class="card" style="background:#f6faff;">
        <div class="form-row">
            <div class="form-group"><label>欠款人</label><input type="text" id="debtorName" value="家人"></div>
            <div class="form-group"><label>事由</label><input type="text" id="debtReason" value="日常"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>金额</label><input type="number" id="debtAmount" min="0.01" step="0.01" value="100"></div>
            <div class="form-group"><label>日期</label><input type="date" id="debtDate"></div>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" id="addDebtBtn"><i class="fas fa-plus-circle"></i> 新增欠债</button>
            <button class="btn btn-success" id="addRepayBtn"><i class="fas fa-hand-holding-heart"></i> 记录还款</button>
        </div>
    </div>

    <!-- 收支选项卡 -->
    <div class="section-title"><i class="fas fa-coins"></i> 收支记录 <span class="badge" id="recordCount">0</span></div>

    <div class="tab-group">
        <button class="tab-btn active" data-tab="incomeTab"><i class="fas fa-arrow-up"></i> 收入</button>
        <button class="tab-btn" data-tab="expenseTab"><i class="fas fa-arrow-down"></i> 支出</button>
        <button class="tab-btn" data-tab="allTab"><i class="fas fa-list"></i> 全部</button>
    </div>

    <div id="incomeTab" class="tab-content active">
        <div class="card" id="incomeList"><div class="empty-message">暂无收入记录</div></div>
    </div>
    <div id="expenseTab" class="tab-content">
        <div class="card" id="expenseList"><div class="empty-message">暂无支出记录</div></div>
    </div>
    <div id="allTab" class="tab-content">
        <div class="card" id="allList"><div class="empty-message">暂无记录</div></div>
    </div>

    <!-- 添加收入 -->
    <div class="card" style="background:#f0faf2;border-color:#b8d9c4;">
        <div style="font-weight:600;color:#1e7e34;margin-bottom:6px;"><i class="fas fa-arrow-up"></i> 添加收入</div>
        <div class="form-row">
            <div class="form-group"><label>来源</label><input type="text" id="incomeSource" value="工资"></div>
            <div class="form-group">
                <label>类别</label>
                <select id="incomeCategory">
                    <option value="工资">工资</option>
                    <option value="奖金">奖金</option>
                    <option value="红包">红包</option>
                    <option value="投资收益">投资收益</option>
                    <option value="兼职">兼职</option>
                    <option value="退款">退款</option>
                    <option value="其他收入">其他收入</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>金额</label><input type="number" id="incomeAmount" min="0.01" step="0.01" value="100"></div>
            <div class="form-group"><label>日期</label><input type="date" id="incomeDate"></div>
        </div>
        <button class="btn btn-success" id="addIncomeBtn"><i class="fas fa-plus-circle"></i> 添加收入</button>
    </div>

    <!-- 添加支出 -->
    <div class="card" style="background:#faf0f0;border-color:#e8c8c8;">
        <div style="font-weight:600;color:#b13e3e;margin-bottom:6px;"><i class="fas fa-arrow-down"></i> 添加支出</div>
        <div class="form-row">
            <div class="form-group"><label>支出人</label><input type="text" id="expensePayer" value="家人"></div>
            <div class="form-group">
                <label>类别</label>
                <select id="expenseCategory">
                    <option value="餐饮">🍜 餐饮</option>
                    <option value="购物">🛍️ 购物</option>
                    <option value="交通">🚗 交通</option>
                    <option value="娱乐">🎮 娱乐</option>
                    <option value="医疗">🏥 医疗</option>
                    <option value="教育">📚 教育</option>
                    <option value="人情">🎁 人情</option>
                    <option value="服饰">👗 服饰</option>
                    <option value="日用品">🧴 日用品</option>
                    <option value="房租">🏠 房租</option>
                    <option value="水电">💡 水电</option>
                    <option value="通讯">📱 通讯</option>
                    <option value="保险">🛡️ 保险</option>
                    <option value="旅游">✈️ 旅游</option>
                    <option value="宠物">🐾 宠物</option>
                    <option value="其他支出">📌 其他</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>金额</label><input type="number" id="expenseAmount" min="0.01" step="0.01" value="50"></div>
            <div class="form-group"><label>日期</label><input type="date" id="expenseDate"></div>
        </div>
        <button class="btn btn-danger" id="addExpenseBtn"><i class="fas fa-plus-circle"></i> 添加支出</button>
    </div>

    <!-- 年度汇总 -->
    <div class="section-title"><i class="fas fa-chart-bar"></i> 年度分析</div>
    <div class="yearly-collapse" id="yearlyToggle">
        <div class="header">
            <span><i class="fas fa-calendar-alt"></i> 2026 年每月汇总</span>
            <i class="fas fa-chevron-down" id="yearlyArrow"></i>
        </div>
        <div class="content" id="yearlyContent">
            <div id="yearlyList"><div class="empty-message">暂无数据</div></div>
        </div>
    </div>

    <!-- 操作 -->
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
        <button class="btn btn-outline btn-sm" id="resetBtn"><i class="fas fa-trash-alt"></i> 重置</button>
        <span style="margin-left:auto;font-size:13px;color:#7b90ae;align-self:center;"><i class="fas fa-database"></i> 云端自动保存</span>
    </div>
    <div class="footer-tip"><i class="fas fa-cloud-upload-alt"></i> 数据实时同步 · 所有设备共用一份账本</div>
</div>

<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js"
    }
}
</script>

<script type="module">
    import { initializeApp } from "firebase/app";
    import { getDatabase, ref, set, get, onValue } from "firebase/database";

    const firebaseConfig = {
        apiKey: "AIzaSyDgRORq3NgVQ4MLTFXBEBmsNIDmdsZ62x4",
        authDomain: "family-budget-7f642.firebaseapp.com",
        databaseURL: "https://family-budget-7f642-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "family-budget-7f642",
        storageBucket: "family-budget-7f642.firebasestorage.app",
        messagingSenderId: "952662467201",
        appId: "1:952662467201:web:7aae8121b20e2155eba380"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // DOM
    const debtContainer = document.getElementById('debtItemsContainer');
    const incomeContainer = document.getElementById('incomeList');
    const expenseContainer = document.getElementById('expenseList');
    const allContainer = document.getElementById('allList');
    const totalIncomeEl = document.getElementById('totalIncome');
    const totalExpenseEl = document.getElementById('totalExpense');
    const netAmountEl = document.getElementById('netAmount');
    const totalDebtEl = document.getElementById('totalDebt');
    const realTimeDebtEl = document.getElementById('realTimeDebt');
    const debtCountEl = document.getElementById('debtCount');
    const recordCountEl = document.getElementById('recordCount');
    const syncDot = document.getElementById('syncDot');
    const syncText = document.getElementById('syncText');
    const monthLabel = document.getElementById('monthLabel');
    const monthIncome = document.getElementById('monthIncome');
    const monthExpense = document.getElementById('monthExpense');
    const monthBalance = document.getElementById('monthBalance');
    const yearlyList = document.getElementById('yearlyList');
    const reminderBanner = document.getElementById('reminderBanner');
    const reminderText = document.getElementById('reminderText');
    const dismissReminderBtn = document.getElementById('dismissReminderBtn');
    const testReminderBtn = document.getElementById('testReminderBtn');

    let data = { debts: [], incomes: [], expenses: [], nextId: 1 };
    let isSyncing = false;

    // ==================== 工具函数 ====================
    function getToday() { return new Date().toISOString().slice(0,10); }
    function getMonth() { return getToday().slice(0,7); }
    function getYear() { return getToday().slice(0,4); }

    function parseDate(d) { return d ? new Date(d + 'T00:00:00') : new Date(); }

    function setStatus(msg, type = 'online') {
        syncDot.className = 'dot';
        if (type === 'syncing') syncDot.className = 'dot syncing';
        syncText.textContent = msg;
    }

    // ==================== 筛选函数 ====================
    function filterByMonth(items, month) {
        return items.filter(d => d.date && d.date.startsWith(month));
    }

    function filterByYear(items, year) {
        return items.filter(d => d.date && d.date.startsWith(year));
    }

    function sumAmount(items) {
        return items.reduce((s, d) => s + (parseFloat(d.amount) || 0), 0);
    }

    // ==================== 计算实时欠款 ====================
    function calcRealTimeDebt() {
        const totalIncome = sumAmount(data.incomes);
        const totalExpense = sumAmount(data.expenses);
        let totalDebt = 0, totalRepay = 0;
        for (let d of data.debts) {
            const amt = parseFloat(d.amount) || 0;
            if (d.type === 'debt') totalDebt += amt;
            else if (d.type === 'repay') totalRepay += amt;
        }
        const netDebt = totalDebt - totalRepay;
        return netDebt - totalIncome + totalExpense;
    }

    // ==================== 渲染主函数 ====================
    function render() {
        renderDebts();
        renderIncomes();
        renderExpenses();
        renderAll();
        updateSummary();
        updateMonthly();
        updateYearly();
        updateReminder();
        debtCountEl.textContent = data.debts.length;
        recordCountEl.textContent = data.incomes.length + data.expenses.length;
    }

    // ==================== 渲染各列表 ====================
    function renderDebts() {
        if (data.debts.length === 0) {
            debtContainer.innerHTML = '<div class="empty-message">暂无欠债记录</div>';
            return;
        }
        let html = '';
        const sorted = [...data.debts].sort((a,b) => a.date < b.date ? 1 : -1);
        for (let d of sorted) {
            const amt = parseFloat(d.amount) || 0;
            const isRepay = d.type === 'repay';
            const sign = '-';
            const cls = isRepay ? 'repay' : 'debt';
            const icon = isRepay ? 'fa-hand-holding-heart' : 'fa-hand-holding-usd';
            const tag = isRepay ? '<span class="tag tag-repay">还款</span>' : '<span class="tag tag-debt">欠债</span>';
            html += `
                <div class="record-item" data-id="${d.id}">
                    <div class="item-left">
                        <div class="item-title"><i class="fas ${icon}" style="margin-right:6px;color:#2a7de1;"></i>${d.debtor || '无名'} · ${d.reason || '无备注'} ${tag}</div>
                        <div class="item-meta"><span><i class="fas fa-calendar-day"></i>${d.date || ''}</span></div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span class="item-amount ${cls}">${sign} ¥${amt.toFixed(2)}</span>
                        <button class="action-icon" data-id="${d.id}" data-action="deleteDebt"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            `;
        }
        debtContainer.innerHTML = html;
        debtContainer.querySelectorAll('[data-action="deleteDebt"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const id = parseInt(this.dataset.id);
                if (confirm('确定删除？')) deleteDebt(id);
            });
        });
    }

    function renderIncomes() {
        if (data.incomes.length === 0) {
            incomeContainer.innerHTML = '<div class="empty-message">暂无收入记录</div>';
            return;
        }
        let html = '';
        const sorted = [...data.incomes].sort((a,b) => a.date < b.date ? 1 : -1);
        for (let d of sorted) {
            const amt = parseFloat(d.amount) || 0;
            html += `
                <div class="record-item" data-id="${d.id}">
                    <div class="item-left">
                        <div class="item-title"><i class="fas fa-arrow-up" style="margin-right:6px;color:#1e7e34;"></i>${d.source || '未知'} · ${d.category || '其他'} <span class="tag tag-income">收入</span></div>
                        <div class="item-meta"><span><i class="fas fa-calendar-day"></i>${d.date || ''}</span></div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span class="item-amount income">+ ¥${amt.toFixed(2)}</span>
                        <button class="action-icon" data-id="${d.id}" data-action="deleteIncome"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            `;
        }
        incomeContainer.innerHTML = html;
        incomeContainer.querySelectorAll('[data-action="deleteIncome"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const id = parseInt(this.dataset.id);
                if (confirm('确定删除？')) deleteIncome(id);
            });
        });
    }

    function renderExpenses() {
        if (data.expenses.length === 0) {
            expenseContainer.innerHTML = '<div class="empty-message">暂无支出记录</div>';
            return;
        }
        let html = '';
        const sorted = [...data.expenses].sort((a,b) => a.date < b.date ? 1 : -1);
        for (let d of sorted) {
            const amt = parseFloat(d.amount) || 0;
            html += `
                <div class="record-item" data-id="${d.id}">
                    <div class="item-left">
                        <div class="item-title"><i class="fas fa-arrow-down" style="margin-right:6px;color:#b13e3e;"></i>${d.payer || '未知'} · ${d.category || '其他'} <span class="tag tag-expense">支出</span></div>
                        <div class="item-meta"><span><i class="fas fa-calendar-day"></i>${d.date || ''}</span></div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span class="item-amount expense">- ¥${amt.toFixed(2)}</span>
                        <button class="action-icon" data-id="${d.id}" data-action="deleteExpense"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            `;
        }
        expenseContainer.innerHTML = html;
        expenseContainer.querySelectorAll('[data-action="deleteExpense"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const id = parseInt(this.dataset.id);
                if (confirm('确定删除？')) deleteExpense(id);
            });
        });
    }

    function renderAll() {
        const all = [...data.incomes.map(d => ({...d, _type: 'income'})), ...data.expenses.map(d => ({...d, _type: 'expense'}))];
        all.sort((a,b) => a.date < b.date ? 1 : -1);
        if (all.length === 0) {
            allContainer.innerHTML = '<div class="empty-message">暂无记录</div>';
            return;
        }
        let html = '';
        for (let d of all) {
            const amt = parseFloat(d.amount) || 0;
            const isIncome = d._type === 'income';
            const icon = isIncome ? 'fa-arrow-up' : 'fa-arrow-down';
            const cls = isIncome ? 'income' : 'expense';
            const sign = isIncome ? '+ ' : '- ';
            const label = isIncome ? (d.source || '收入') : (d.payer || '支出');
            const cat = isIncome ? d.category : d.category;
            const tag = isIncome ? '<span class="tag tag-income">收入</span>' : '<span class="tag tag-expense">支出</span>';
            html += `
                <div class="record-item">
                    <div class="item-left">
                        <div class="item-title"><i class="fas ${icon}" style="margin-right:6px;color:${isIncome ? '#1e7e34' : '#b13e3e'};"></i>${label} · ${cat} ${tag}</div>
                        <div class="item-meta"><span><i class="fas fa-calendar-day"></i>${d.date || ''}</span></div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span class="item-amount ${cls}">${sign}¥${amt.toFixed(2)}</span>
                    </div>
                </div>
            `;
        }
        allContainer.innerHTML = html;
    }

    // ==================== 汇总更新 ====================
    function updateSummary() {
        const totalIncome = sumAmount(data.incomes);
        const totalExpense = sumAmount(data.expenses);
        const net = totalIncome - totalExpense;
        let totalDebt = 0, totalRepay = 0;
        for (let d of data.debts) {
            const amt = parseFloat(d.amount) || 0;
            if (d.type === 'debt') totalDebt += amt;
            else if (d.type === 'repay') totalRepay += amt;
        }
        const netDebt = totalDebt - totalRepay;
        const realTimeDebt = netDebt - totalIncome + totalExpense;

        totalIncomeEl.textContent = `+ ¥${totalIncome.toFixed(2)}`;
        totalExpenseEl.textContent = `- ¥${totalExpense.toFixed(2)}`;
        netAmountEl.textContent = net >= 0 ? `+ ¥${net.toFixed(2)}` : `- ¥${Math.abs(net).toFixed(2)}`;
        netAmountEl.style.color = net >= 0 ? '#1e7e34' : '#c53e3e';
        totalDebtEl.textContent = `- ¥${netDebt.toFixed(2)}`;
        totalDebtEl.style.color = netDebt > 0 ? '#c53e3e' : '#1e7e34';
        realTimeDebtEl.textContent = realTimeDebt > 0 ? `- ¥${realTimeDebt.toFixed(2)}` : `+ ¥${Math.abs(realTimeDebt).toFixed(2)}`;
        realTimeDebtEl.style.color = realTimeDebt > 0 ? '#c53e3e' : '#1e7e34';
    }

    // ==================== 月度分析 ====================
    function updateMonthly() {
        const month = getMonth();
        const monthIncomes = filterByMonth(data.incomes, month);
        const monthExpenses = filterByMonth(data.expenses, month);
        const inc = sumAmount(monthIncomes);
        const exp = sumAmount(monthExpenses);
        const bal = inc - exp;

        monthLabel.textContent = month.replace('-', '年') + '月';
        monthIncome.textContent = `¥${inc.toFixed(2)}`;
        monthExpense.textContent = `¥${exp.toFixed(2)}`;
        monthBalance.textContent = `¥${bal.toFixed(2)}`;
        monthBalance.style.color = bal >= 0 ? '#1e7e34' : '#c53e3e';
    }

    // ==================== 年度分析 ====================
    function updateYearly() {
        const year = getYear();
        const yearIncomes = filterByYear(data.incomes, year);
        const yearExpenses = filterByYear(data.expenses, year);
        const months = new Set();
        yearIncomes.forEach(d => { if (d.date) months.add(d.date.slice(0,7)); });
        yearExpenses.forEach(d => { if (d.date) months.add(d.date.slice(0,7)); });

        if (months.size === 0) {
            yearlyList.innerHTML = '<div class="empty-message">暂无数据</div>';
            return;
        }

        const sortedMonths = [...months].sort();
        let html = '';
        for (let m of sortedMonths) {
            const inc = sumAmount(filterByMonth(yearIncomes, m));
            const exp = sumAmount(filterByMonth(yearExpenses, m));
            const bal = inc - exp;
            html += `
                <div class="yearly-row">
                    <span class="month">${m.replace('-', '年')}月</span>
                    <span><span class="in">+¥${inc.toFixed(2)}</span> / <span class="out">-¥${exp.toFixed(2)}</span></span>
                    <span style="font-weight:600;color:${bal>=0?'#1e7e34':'#c53e3e'}">${bal>=0?'+':''}¥${bal.toFixed(2)}</span>
                </div>
            `;
        }
        yearlyList.innerHTML = html;
    }

    // ==================== 每日提醒 ====================
    function updateReminder() {
        // 检查今天是否已显示过提醒（存在 localStorage 标记）
        const today = getToday();
        const dismissed = localStorage.getItem('reminder_dismissed_' + today);
        if (dismissed === 'true') {
            reminderBanner.style.display = 'none';
            return;
        }

        // 生成提醒内容
        const totalIncome = sumAmount(data.incomes);
        const totalExpense = sumAmount(data.expenses);
        const net = totalIncome - totalExpense;
        const realDebt = calcRealTimeDebt();

        let msg = `📊 当前总览：总收入 +¥${totalIncome.toFixed(2)}，总支出 -¥${totalExpense.toFixed(2)}`;
        if (realDebt > 0) {
            msg += `，实时欠款 -¥${realDebt.toFixed(2)}`;
        } else {
            msg += `，已无欠债 👍`;
        }

        reminderText.textContent = msg;
        reminderBanner.style.display = 'flex';
    }

    function showReminder() {
        const totalIncome = sumAmount(data.incomes);
        const totalExpense = sumAmount(data.expenses);
        const realDebt = calcRealTimeDebt();
        let msg = `📊 当前总览：总收入 +¥${totalIncome.toFixed(2)}，总支出 -¥${totalExpense.toFixed(2)}`;
        if (realDebt > 0) {
            msg += `，实时欠款 -¥${realDebt.toFixed(2)}`;
        } else {
            msg += `，已无欠债 👍`;
        }
        alert(msg);
    }

    function dismissReminder() {
        const today = getToday();
        localStorage.setItem('reminder_dismissed_' + today, 'true');
        reminderBanner.style.display = 'none';
    }

    // ==================== Firebase 操作 ====================
    function saveToFirebase() {
        setStatus('正在保存...', 'syncing');
        set(ref(db, '记账数据'), data)
            .then(() => setStatus('✅ 已保存 ' + new Date().toLocaleTimeString()))
            .catch(() => setStatus('❌ 保存失败'));
    }

    function loadFromFirebase() {
        setStatus('加载中...', 'syncing');
        get(ref(db, '记账数据')).then((snapshot) => {
            if (snapshot.exists()) {
                data = snapshot.val();
                if (!data.debts) data.debts = [];
                if (!data.incomes) data.incomes = [];
                if (!data.expenses) data.expenses = [];
                if (!data.nextId) data.nextId = 1;
                render();
                setStatus('✅ 已同步 ' + new Date().toLocaleTimeString());
            } else {
                data = { debts: [], incomes: [], expenses: [], nextId: 1 };
                render();
                saveToFirebase();
                setStatus('☁️ 已初始化');
            }
        }).catch(() => {
            setStatus('⚠️ 离线模式');
        });
    }

    function listenChanges() {
        onValue(ref(db, '记账数据'), (snapshot) => {
            if (snapshot.exists() && !isSyncing) {
                const newData = snapshot.val();
                if (newData.debts && newData.incomes !== undefined && newData.expenses !== undefined) {
                    data = newData;
                    render();
                    setStatus('🔄 已更新 ' + new Date().toLocaleTimeString());
                }
            }
        });
    }

    // ==================== 操作函数 ====================
    function deleteDebt(id) { data.debts = data.debts.filter(d => d.id !== id); saveToFirebase(); render(); }
    function deleteIncome(id) { data.incomes = data.incomes.filter(d => d.id !== id); saveToFirebase(); render(); }
    function deleteExpense(id) { data.expenses = data.expenses.filter(d => d.id !== id); saveToFirebase(); render(); }

    function addDebt() {
        const debtor = document.getElementById('debtorName').value.trim() || '家人';
        const reason = document.getElementById('debtReason').value.trim() || '日常';
        const amount = parseFloat(document.getElementById('debtAmount').value);
        const date = document.getElementById('debtDate').value || getToday();
        if (!amount || amount <= 0) { alert('请输入有效金额'); return; }
        isSyncing = true;
        data.debts.push({ id: data.nextId++, debtor, reason, amount, date, type: 'debt' });
        saveToFirebase(); render(); isSyncing = false;
        document.getElementById('debtAmount').value = '';
    }

    function addRepay() {
        const debtor = document.getElementById('debtorName').value.trim() || '家人';
        const reason = document.getElementById('debtReason').value.trim() || '还款';
        const amount = parseFloat(document.getElementById('debtAmount').value);
        const date = document.getElementById('debtDate').value || getToday();
        if (!amount || amount <= 0) { alert('请输入有效金额'); return; }
        isSyncing = true;
        data.debts.push({ id: data.nextId++, debtor, reason: reason + ' (还款)', amount, date, type: 'repay' });
        saveToFirebase(); render(); isSyncing = false;
        document.getElementById('debtAmount').value = '';
    }

    function addIncome() {
        const source = document.getElementById('incomeSource').value.trim() || '工资';
        const category = document.getElementById('incomeCategory').value;
        const amount = parseFloat(document.getElementById('incomeAmount').value);
        const date = document.getElementById('incomeDate').value || getToday();
        if (!amount || amount <= 0) { alert('请输入有效金额'); return; }
        isSyncing = true;
        data.incomes.push({ id: data.nextId++, source, category, amount, date });
        saveToFirebase(); render(); isSyncing = false;
        document.getElementById('incomeAmount').value = '';
    }

    function addExpense() {
        const payer = document.getElementById('expensePayer').value.trim() || '家人';
        const category = document.getElementById('expenseCategory').value;
        const amount = parseFloat(document.getElementById('expenseAmount').value);
        const date = document.getElementById('expenseDate').value || getToday();
        if (!amount || amount <= 0) { alert('请输入有效金额'); return; }
        isSyncing = true;
        data.expenses.push({ id: data.nextId++, payer, category, amount, date });
        saveToFirebase(); render(); isSyncing = false;
        document.getElementById('expenseAmount').value = '';
    }

    function resetData() {
        if (confirm('确定删除所有数据？此操作会同步到所有设备！')) {
            data = { debts: [], incomes: [], expenses: [], nextId: 1 };
            saveToFirebase(); render();
        }
    }

    // ==================== 事件绑定 ====================
    // 选项卡切换
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(this.dataset.tab).classList.add('active');
        });
    });

    // 年度折叠
    document.getElementById('yearlyToggle').addEventListener('click', function() {
        const content = document.getElementById('yearlyContent');
        const arrow = document.getElementById('yearlyArrow');
        content.classList.toggle('open');
        arrow.classList.toggle('open');
    });

    // 提醒
    dismissReminderBtn.addEventListener('click', dismissReminder);
    testReminderBtn.addEventListener('click', showReminder);

    // 按钮绑定
    document.getElementById('addDebtBtn').addEventListener('click', addDebt);
    document.getElementById('addRepayBtn').addEventListener('click', addRepay);
    document.getElementById('addIncomeBtn').addEventListener('click', addIncome);
    document.getElementById('addExpenseBtn').addEventListener('click', addExpense);
    document.getElementById('resetBtn').addEventListener('click', resetData);

    document.getElementById('debtAmount').addEventListener('keypress', (e) => { if (e.key === 'Enter') addDebt(); });
    document.getElementById('incomeAmount').addEventListener('keypress', (e) => { if (e.key === 'Enter') addIncome(); });
    document.getElementById('expenseAmount').addEventListener('keypress', (e) => { if (e.key === 'Enter') addExpense(); });

    // ==================== 每日定时提醒（每天早上8点） ====================
    function scheduleDailyReminder() {
        const now = new Date();
        const target = new Date();
        target.setHours(8, 0, 0, 0);
        if (now > target) {
            target.setDate(target.getDate() + 1);
        }
        const delay = target - now;
        setTimeout(() => {
            // 重置今日已关闭标记
            const today = getToday();
            localStorage.removeItem('reminder_dismissed_' + today);
            // 刷新提醒
            updateReminder();
            // 继续调度明天的提醒
            scheduleDailyReminder();
        }, delay);
    }

    // ==================== 初始化 ====================
    const today = getToday();
    ['debtDate', 'incomeDate', 'expenseDate'].forEach(id => {
        if (!document.getElementById(id).value) document.getElementById(id).value = today;
    });

    loadFromFirebase();
    listenChanges();

    // 启动每日提醒调度
    scheduleDailyReminder();

    console.log('✅ 家庭记账 (分析版) 已启动');
    console.log('📅 每日提醒已设置 (早上8:00)');
</script>
</body>
</html>

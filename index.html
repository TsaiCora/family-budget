<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>家庭记账 · 云端同步</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
        body { background: #f7f9fc; padding: 20px 12px 40px; min-height: 100vh; display: flex; justify-content: center; }
        .app-container { max-width: 720px; width: 100%; background: white; border-radius: 36px; box-shadow: 0 20px 40px rgba(0,10,30,0.08); padding: 24px 20px 32px; }
        h1 { font-size: 28px; font-weight: 600; color: #0b1b33; display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
        h1 i { color: #2a7de1; }
        .subhead { color: #5b6f8c; font-size: 15px; margin-bottom: 24px; border-left: 3px solid #2a7de1; padding-left: 14px; background: #f0f4fe; border-radius: 0 12px 12px 0; line-height: 1.5; }
        .sync-status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #4f658a; background: #e8edf5; padding: 6px 16px; border-radius: 40px; margin-bottom: 16px; }
        .sync-status .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .sync-status .dot.online { background: #1e7e34; }
        .sync-status .dot.offline { background: #b13e3e; }
        .sync-status .dot.syncing { background: #f5a623; animation: pulse 0.8s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; background: #f0f5ff; padding: 16px 12px; border-radius: 28px; margin-bottom: 28px; }
        .summary-item { text-align: center; }
        .summary-item .label { font-size: 12px; font-weight: 500; color: #4f658a; }
        .summary-item .value { font-size: 22px; font-weight: 700; color: #0b1b33; margin-top: 4px; }
        .summary-item .value.positive { color: #1e7e34; }
        .summary-item .value.negative { color: #c53e3e; }
        .summary-item .value.neutral { color: #2a4b7a; }
        .section-title { font-size: 18px; font-weight: 600; color: #1f2b44; display: flex; align-items: center; gap: 10px; margin: 28px 0 16px 0; flex-wrap: wrap; }
        .section-title i { color: #2a7de1; width: 24px; text-align: center; }
        .section-title .badge { background: #dbe7f9; color: #1f3a6b; font-size: 13px; font-weight: 500; padding: 2px 12px; border-radius: 40px; }
        .section-title .toolbar { margin-left: auto; display: flex; gap: 8px; }
        .card { background: #ffffff; border-radius: 24px; padding: 18px 16px; box-shadow: 0 4px 12px rgba(0,20,40,0.04); border: 1px solid #e8edf5; margin-bottom: 18px; }
        .debt-item, .expense-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eef2f9; }
        .debt-item:last-child, .expense-item:last-child { border-bottom: none; }
        .item-left { display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .item-title { font-weight: 600; color: #14273e; font-size: 16px; }
        .item-meta { font-size: 13px; color: #6a7f9e; display: flex; flex-wrap: wrap; gap: 10px; }
        .item-meta i { margin-right: 4px; }
        .item-amount { font-weight: 650; font-size: 17px; white-space: nowrap; }
        .item-amount.positive { color: #1e7e34; }
        .item-amount.negative { color: #b13e3e; }
        .empty-message { color: #8a9bb8; font-size: 15px; padding: 12px 0 6px; text-align: center; }
        .form-row { display: flex; flex-wrap: wrap; gap: 12px 8px; margin: 12px 0 6px; }
        .form-group { flex: 1 0 calc(50% - 8px); min-width: 150px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #2d4468; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 12px 14px; border: 1px solid #d8e0ec; border-radius: 18px; font-size: 15px; background: white; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: #2a7de1; box-shadow: 0 0 0 3px rgba(42,125,225,0.15); }
        .form-group .category-select-wrapper { display: flex; gap: 6px; align-items: center; }
        .form-group .category-select-wrapper select { flex: 1; }
        .btn-icon-only { background: #eef3fc; border: 1px solid #d8e0ec; border-radius: 40px; padding: 10px 14px; font-size: 16px; color: #1f3a6b; cursor: pointer; transition: 0.1s; white-space: nowrap; }
        .btn-icon-only:hover { background: #dce6f5; }
        .btn-group { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
        .btn { border: none; padding: 12px 24px; border-radius: 40px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: 0.15s; flex: 1 0 auto; background: #eef3fc; color: #1d3a66; }
        .btn-primary { background: #1a3f77; color: white; }
        .btn-primary:hover { background: #12315e; transform: scale(0.97); }
        .btn-success { background: #1b7e3a; color: white; }
        .btn-success:hover { background: #13662e; transform: scale(0.97); }
        .btn-danger { background: #b13e3e; color: white; }
        .btn-danger:hover { background: #942f2f; transform: scale(0.97); }
        .btn-outline { background: transparent; border: 1px solid #c6d3e8; }
        .btn-outline:hover { background: #eaf0fa; }
        .btn-sm { padding: 6px 14px; font-size: 13px; flex: 0 1 auto; }
        .btn-sync { background: #1e7e34; color: white; }
        .btn-sync:hover { background: #14662a; transform: scale(0.97); }
        .action-icon { background: transparent; border: none; color: #687c9e; cursor: pointer; padding: 4px 8px; border-radius: 30px; transition: 0.1s; }
        .action-icon:hover { background: #e9eff8; color: #1f3f6b; }
        .footer-tip { margin-top: 28px; color: #6d83a5; font-size: 13px; text-align: center; border-top: 1px solid #e4ebf5; padding-top: 20px; }
        .footer-tip i { color: #2a7de1; }
        @media (max-width: 480px) { .summary-grid { grid-template-columns: 1fr 1fr; } .form-group { flex: 1 0 100%; } .btn-group .btn { flex: 1 0 100%; } .section-title .toolbar { margin-left: 0; width: 100%; } }
    </style>
</head>
<body>
<div class="app-container" id="app">
    <header>
        <h1><i class="fas fa-cloud"></i> 家庭共记 · 云同步</h1>
        <div class="subhead"><i class="fas fa-users" style="margin-right:8px;"></i> 家人共同填写 · 自动云端同步</div>
        <div class="sync-status" id="syncStatus">
            <span class="dot online" id="syncDot"></span>
            <span id="syncText">已连接 · 实时同步</span>
        </div>
    </header>

    <div class="summary-grid">
        <div class="summary-item"><div class="label"><i class="fas fa-hand-holding-usd"></i> 总欠债</div><div class="value negative" id="totalDebt">0</div></div>
        <div class="summary-item"><div class="label"><i class="fas fa-undo-alt"></i> 已还款</div><div class="value neutral" id="totalRepay">0</div></div>
        <div class="summary-item"><div class="label"><i class="fas fa-shopping-cart"></i> 总支出</div><div class="value positive" id="totalExpense">0</div></div>
    </div>

    <div class="section-title">
        <i class="fas fa-file-invoice"></i> 欠债 & 还款
        <span class="badge" id="debtCount">0</span>
    </div>
    <div class="card"><div id="debtItemsContainer"><div class="empty-message"><i class="fas fa-circle-plus"></i> 暂无欠债记录</div></div></div>

    <div class="card" style="background:#f6faff;border-color:#d4e2fa;">
        <div class="form-row">
            <div class="form-group"><label><i class="fas fa-user"></i> 欠款人</label><input type="text" id="debtorName" placeholder="例: 小明" value="家人"></div>
            <div class="form-group"><label><i class="fas fa-tag"></i> 事由</label><input type="text" id="debtReason" placeholder="买家电/学费" value="日常"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label><i class="fas fa-dollar-sign"></i> 金额</label><input type="number" id="debtAmount" placeholder="0" min="0.01" step="0.01" value="100"></div>
            <div class="form-group"><label><i class="fas fa-calendar-alt"></i> 日期</label><input type="date" id="debtDate"></div>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" id="addDebtBtn"><i class="fas fa-plus-circle"></i> 新增欠债</button>
            <button class="btn btn-success" id="addRepayBtn"><i class="fas fa-hand-holding-heart"></i> 记录还款</button>
        </div>
    </div>

    <div class="section-title">
        <i class="fas fa-receipt"></i> 日常支出
        <span class="badge" id="expenseCount">0</span>
        <div class="toolbar"><button class="btn-icon-only" id="editCategoriesBtn"><i class="fas fa-pen"></i> 类别</button></div>
    </div>
    <div class="card"><div id="expenseItemsContainer"><div class="empty-message"><i class="fas fa-circle-plus"></i> 暂无支出记录</div></div></div>

    <div class="card" style="background:#f6faff;border-color:#d4e2fa;">
        <div class="form-row">
            <div class="form-group"><label><i class="fas fa-user"></i> 支出人</label><input type="text" id="expensePayer" placeholder="例: 妈妈" value="家人"></div>
            <div class="form-group">
                <label><i class="fas fa-shopping-bag"></i> 类别</label>
                <div class="category-select-wrapper">
                    <select id="expenseCategorySelect"></select>
                    <button class="btn-icon-only" id="quickAddCategoryBtn" title="快速添加"><i class="fas fa-plus"></i></button>
                </div>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group"><label><i class="fas fa-dollar-sign"></i> 金额</label><input type="number" id="expenseAmount" placeholder="0" min="0.01" step="0.01" value="50"></div>
            <div class="form-group"><label><i class="fas fa-calendar-alt"></i> 日期</label><input type="date" id="expenseDate"></div>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" id="addExpenseBtn"><i class="fas fa-plus-circle"></i> 添加支出</button>
        </div>
    </div>

    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
        <button class="btn btn-sync btn-sm" id="syncNowBtn"><i class="fas fa-sync-alt"></i> 立即同步</button>
        <button class="btn btn-outline btn-sm" id="resetDataBtn"><i class="fas fa-trash-alt"></i> 重置</button>
        <span style="margin-left:auto;font-size:13px;color:#7b90ae;align-self:center;"><i class="fas fa-database"></i> 云端自动保存</span>
    </div>
    <div class="footer-tip"><i class="fas fa-cloud-upload-alt"></i> 数据实时同步 · 所有设备共用一份账本</div>
</div>

<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js"
    }
}
</script>

<script type="module">
    import { initializeApp } from "firebase/app";
    import { getDatabase, ref, set, get, onValue } from "firebase/database";

    // 您的 Firebase 配置（已包含 databaseURL）
    const firebaseConfig = {
        apiKey: "AIzaSyDgRORq3NgVQ4MLTFXBEBmsNIDmdsZ62x4",
        authDomain: "family-budget-7f642.firebaseapp.com",
        databaseURL: "https://family-budget-7f642-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "family-budget-7f642",
        storageBucket: "family-budget-7f642.firebasestorage.app",
        messagingSenderId: "952662467201",
        appId: "1:952662467201:web:7aae8121b20e2155eba380"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const DB_PATH = 'familyBudgetData';

    // DOM 引用
    const debtContainer = document.getElementById('debtItemsContainer');
    const expenseContainer = document.getElementById('expenseItemsContainer');
    const totalDebtEl = document.getElementById('totalDebt');
    const totalRepayEl = document.getElementById('totalRepay');
    const totalExpenseEl = document.getElementById('totalExpense');
    const debtCountEl = document.getElementById('debtCount');
    const expenseCountEl = document.getElementById('expenseCount');
    const debtorName = document.getElementById('debtorName');
    const debtReason = document.getElementById('debtReason');
    const debtAmount = document.getElementById('debtAmount');
    const debtDate = document.getElementById('debtDate');
    const expensePayer = document.getElementById('expensePayer');
    const expenseCategorySelect = document.getElementById('expenseCategorySelect');
    const expenseAmount = document.getElementById('expenseAmount');
    const expenseDate = document.getElementById('expenseDate');
    const addDebtBtn = document.getElementById('addDebtBtn');
    const addRepayBtn = document.getElementById('addRepayBtn');
    const addExpenseBtn = document.getElementById('addExpenseBtn');
    const resetBtn = document.getElementById('resetDataBtn');
    const syncNowBtn = document.getElementById('syncNowBtn');
    const syncDot = document.getElementById('syncDot');
    const syncText = document.getElementById('syncText');

    let appData = { debts: [], expenses: [], nextId: 1 };
    let categories = ['餐饮', '购物', '交通', '娱乐', '医疗', '教育', '人情', '服饰', '日用品', '其他'];
    let isSyncing = false;

    function setSyncStatus(status, msg) {
        syncDot.className = 'dot';
        if (status === 'online') { syncDot.classList.add('online'); syncText.textContent = msg || '已连接 · 实时同步'; }
        else if (status === 'offline') { syncDot.classList.add('offline'); syncText.textContent = msg || '离线 · 数据保存在本地'; }
        else if (status === 'syncing') { syncDot.classList.add('syncing'); syncText.textContent = msg || '同步中...'; }
    }

    function saveToFirebase(data) {
        setSyncStatus('syncing', '正在保存...');
        set(ref(database, DB_PATH), data)
            .then(() => {
                setSyncStatus('online', '已保存 · ' + new Date().toLocaleTimeString());
            })
            .catch((err) => {
                console.error('保存失败:', err);
                setSyncStatus('offline', '保存失败，请检查网络');
            });
        localStorage.setItem('family_budget_cache', JSON.stringify(data));
    }

    function loadFromFirebase() {
        setSyncStatus('syncing', '正在加载数据...');
        get(ref(database, DB_PATH)).then((snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                if (data.debts && data.expenses && typeof data.nextId === 'number') {
                    appData = data;
                    if (data.categories) categories = data.categories;
                    renderAll();
                    setSyncStatus('online', '已同步 · ' + new Date().toLocaleTimeString());
                } else {
                    initializeFirebaseData();
                }
            } else {
                initializeFirebaseData();
            }
        }).catch((err) => {
            console.error('加载失败:', err);
            setSyncStatus('offline', '离线模式 · 使用本地缓存');
            loadFromLocalStorage();
        });
    }

    function initializeFirebaseData() {
        const defaultData = { debts: [], expenses: [], nextId: 1, categories: categories };
        appData = defaultData;
        saveToFirebase(defaultData);
        renderAll();
        setSyncStatus('online', '已初始化 · 开始记账吧！');
    }

    function loadFromLocalStorage() {
        try {
            const raw = localStorage.getItem('family_budget_cache');
            if (raw) {
                const data = JSON.parse(raw);
                if (data.debts && data.expenses) {
                    appData = data;
                    if (data.categories) categories = data.categories;
                    renderAll();
                    return;
                }
            }
        } catch(e) {}
        appData = { debts: [], expenses: [], nextId: 1 };
        renderAll();
    }

    function listenFirebaseChanges() {
        onValue(ref(database, DB_PATH), (snapshot) => {
            if (snapshot.exists() && !isSyncing) {
                const data = snapshot.val();
                if (data.debts && data.expenses && typeof data.nextId === 'number') {
                    appData = data;
                    if (data.categories) categories = data.categories;
                    renderAll();
                    setSyncStatus('online', '已更新 · ' + new Date().toLocaleTimeString());
                }
            }
        }, (error) => {
            console.error('监听失败:', error);
            setSyncStatus('offline', '连接中断');
        });
    }

    function renderAll() {
        renderDebts();
        renderExpenses();
        updateSummary();
        debtCountEl.textContent = appData.debts.length;
        expenseCountEl.textContent = appData.expenses.length;
        renderCategorySelect();
        localStorage.setItem('family_budget_cache', JSON.stringify(appData));
    }

    function renderDebts() {
        if (appData.debts.length === 0) {
            debtContainer.innerHTML = `<div class="empty-message"><i class="fas fa-circle-plus"></i> 暂无欠债记录</div>`;
            return;
        }
        let html = '';
        const sorted = [...appData.debts].sort((a,b) => a.date < b.date ? 1 : -1);
        for (let debt of sorted) {
            const amountNum = parseFloat(debt.amount) || 0;
            const sign = debt.type === 'repay' ? '-' : '+';
            const amountClass = debt.type === 'repay' ? 'positive' : 'negative';
            const icon = debt.type === 'repay' ? 'fa-hand-holding-heart' : 'fa-hand-holding-usd';
            const label = debt.type === 'repay' ? '还款' : '欠债';
            html += `
                <div class="debt-item" data-id="${debt.id}">
                    <div class="item-left">
                        <div class="item-title"><i class="fas ${icon}" style="margin-right:6px; color:#2a7de1;"></i>${debt.debtor || '无名'} · ${debt.reason || '无备注'}</div>
                        <div class="item-meta"><span><i class="fas fa-calendar-day"></i>${debt.date || '未设'}</span><span><i class="fas fa-tag"></i>${label}</span></div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span class="item-amount ${amountClass}">${sign} ¥${amountNum.toFixed(2)}</span>
                        <button class="action-icon" data-id="${debt.id}" data-action="deleteDebt"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            `;
        }
        debtContainer.innerHTML = html;
        debtContainer.querySelectorAll('[data-action="deleteDebt"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const id = parseInt(this.dataset.id);
                if (confirm('确定删除此条记录吗？')) deleteDebtById(id);
            });
        });
    }

    function renderExpenses() {
        if (appData.expenses.length === 0) {
            expenseContainer.innerHTML = `<div class="empty-message"><i class="fas fa-circle-plus"></i> 暂无支出记录</div>`;
            return;
        }
        let html = '';
        const sorted = [...appData.expenses].sort((a,b) => a.date < b.date ? 1 : -1);
        for (let exp of sorted) {
            const amountNum = parseFloat(exp.amount) || 0;
            html += `
                <div class="expense-item" data-id="${exp.id}">
                    <div class="item-left">
                        <div class="item-title"><i class="fas fa-user" style="margin-right:6px; color:#2a7de1;"></i>${exp.payer || '未知'} · ${exp.category || '其他'}</div>
                        <div class="item-meta"><span><i class="fas fa-calendar-day"></i>${exp.date || '未设'}</span></div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span class="item-amount positive">- ¥${amountNum.toFixed(2)}</span>
                        <button class="action-icon" data-id="${exp.id}" data-action="deleteExpense"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            `;
        }
        expenseContainer.innerHTML = html;
        expenseContainer.querySelectorAll('[data-action="deleteExpense"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const id = parseInt(this.dataset.id);
                if (confirm('删除此支出记录？')) deleteExpenseById(id);
            });
        });
    }

    function updateSummary() {
        let totalDebt = 0, totalRepay = 0;
        for (let d of appData.debts) {
            const amt = parseFloat(d.amount) || 0;
            if (d.type === 'debt') totalDebt += amt;
            else if (d.type === 'repay') totalRepay += amt;
        }
        const netDebt = totalDebt - totalRepay;
        const totalExpense = appData.expenses.reduce((sum, e) => sum + (parseFloat(e.amount) || 0), 0);
        totalDebtEl.textContent = `¥${netDebt.toFixed(2)}`;
        totalRepayEl.textContent = `¥${totalRepay.toFixed(2)}`;
        totalExpenseEl.textContent = `¥${totalExpense.toFixed(2)}`;
    }

    function renderCategorySelect() {
        const currentVal = expenseCategorySelect.value;
        expenseCategorySelect.innerHTML = '';
        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat; opt.textContent = cat;
            expenseCategorySelect.appendChild(opt);
        });
        if (categories.includes(currentVal)) expenseCategorySelect.value = currentVal;
        else if (categories.length > 0) expenseCategorySelect.value = categories[0];
    }

    function saveAndSync(data) {
        isSyncing = true;
        appData = data;
        saveToFirebase(data);
        renderAll();
        isSyncing = false;
    }

    function deleteDebtById(id) {
        appData.debts = appData.debts.filter(d => d.id !== id);
        saveAndSync(appData);
    }

    function deleteExpenseById(id) {
        appData.expenses = appData.expenses.filter(e => e.id !== id);
        saveAndSync(appData);
    }

    function addDebt() {
        const debtor = debtorName.value.trim() || '家人';
        const reason = debtReason.value.trim() || '未备注';
        const amount = parseFloat(debtAmount.value);
        const date = debtDate.value || new Date().toISOString().slice(0,10);
        if (isNaN(amount) || amount <= 0) { alert('请输入有效金额'); return; }
        appData.debts.push({ id: appData.nextId++, debtor, reason, amount, date, type: 'debt' });
        saveAndSync(appData);
        debtAmount.value = '';
        debtReason.value = '日常';
        setDefaultDates();
        debtorName.focus();
    }

    function addRepay() {
        const debtor = debtorName.value.trim() || '家人';
        const reason = debtReason.value.trim() || '还款';
        const amount = parseFloat(debtAmount.value);
        const date = debtDate.value || new Date().toISOString().slice(0,10);
        if (isNaN(amount) || amount <= 0) { alert('请输入有效还款金额'); return; }
        appData.debts.push({ id: appData.nextId++, debtor, reason: reason + ' (还款)', amount, date, type: 'repay' });
        saveAndSync(appData);
        debtAmount.value = '';
        debtReason.value = '日常';
        setDefaultDates();
        debtorName.focus();
    }

    function addExpense() {
        const payer = expensePayer.value.trim() || '家人';
        const category = expenseCategorySelect.value || '其他';
        const amount = parseFloat(expenseAmount.value);
        const date = expenseDate.value || new Date().toISOString().slice(0,10);
        if (isNaN(amount) || amount <= 0) { alert('请输入有效支出金额'); return; }
        appData.expenses.push({ id: appData.nextId++, payer, category, amount, date });
        saveAndSync(appData);
        expenseAmount.value = '';
        setDefaultDates();
        expensePayer.focus();
    }

    function resetData() {
        if (confirm('⚠️ 确定删除所有数据？此操作会同步到所有设备！')) {
            appData = { debts: [], expenses: [], nextId: 1 };
            saveAndSync(appData);
            setDefaultDates();
        }
    }

    function syncNow() {
        loadFromFirebase();
    }

    function setDefaultDates() {
        const today = new Date().toISOString().slice(0,10);
        if (!debtDate.value) debtDate.value = today;
        if (!expenseDate.value) expenseDate.value = today;
    }

    // 绑定事件
    addDebtBtn.addEventListener('click', addDebt);
    addRepayBtn.addEventListener('click', addRepay);
    addExpenseBtn.addEventListener('click', addExpense);
    resetBtn.addEventListener('click', resetData);
    syncNowBtn.addEventListener('click', syncNow);
    document.getElementById('debtAmount').addEventListener('keypress', (e) => { if (e.key === 'Enter') addDebt(); });
    document.getElementById('expenseAmount').addEventListener('keypress', (e) => { if (e.key === 'Enter') addExpense(); });

    document.getElementById('quickAddCategoryBtn').addEventListener('click', function() {
        const name = prompt('输入新支出类别：');
        if (name && name.trim()) {
            const trimmed = name.trim();
            if (categories.includes(trimmed)) { alert('类别已存在'); return; }
            categories.push(trimmed);
            saveToFirebase(appData);
            renderCategorySelect();
            expenseCategorySelect.value = trimmed;
        }
    });

    document.getElementById('editCategoriesBtn').addEventListener('click', function() {
        let list = categories.join(', ');
        const newList = prompt('编辑类别（用逗号分隔）：', list);
        if (newList !== null) {
            const newCats = newList.split(',').map(s => s.trim()).filter(s => s.length > 0);
            if (newCats.length > 0) {
                categories = newCats;
                saveToFirebase(appData);
                renderCategorySelect();
                renderAll();
            } else {
                alert('至少保留一个类别');
            }
        }
    });

    // 初始化
    setDefaultDates();
    loadFromFirebase();
    listenFirebaseChanges();

    console.log('✅ 家庭记账 · 云端同步已启动！');
    console.log('📊 数据库: family-budget-7f642-default-rtdb');
</script>
</body>
</html>
